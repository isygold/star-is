import java.net.URL
import java.nio.file.Files
import java.nio.file.Paths
import java.security.MessageDigest

/**
 * Locate the Android NDK path from the project's local properties
 * or SDK manager, in that order of precedence.
 */
def findNdkPath() {
    // 1. ndkDir from local.properties (set by AGP)
    if (project.hasProperty("android.ndkDirectory") && project.android.ndkDirectory != null) {
        return project.android.ndkDirectory.absolutePath
    }
    // 2. ANDROID_NDK_HOME env var
    def env = System.getenv("ANDROID_NDK_HOME")
    if (env != null && !env.empty) {
        return env
    }
    // 3. ANDROID_HOME + ndk-bundle
    def sdk = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
    if (sdk != null) {
        def ndkBundle = new File(sdk, "ndk-bundle")
        if (ndkBundle.isDirectory()) return ndkBundle.absolutePath
        // 4. Most recent NDK under $ANDROID_HOME/ndk/
        def ndkDir = new File(sdk, "ndk")
        if (ndkDir.isDirectory()) {
            def versions = ndkDir.listFiles().findAll { it.isDirectory() }
            if (!versions.empty) {
                versions.sort { it.name }
                return versions.last().absolutePath
            }
        }
    }
    return null
}

